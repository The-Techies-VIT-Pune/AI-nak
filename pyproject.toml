[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "ai-nak"
version = "0.1.0"
description = "AI-nak: Regime-aware multimodal market intelligence and portfolio research system"
readme = "README.md"
requires-python = ">=3.11,<3.13"


[tool.setuptools.packages.find]
where = ["src"]


[tool.black]
line-length = 88
target-version = ["py311"]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]